[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismail-api"
version = "0.1.0"
description = "Phase 1 FastAPI scaffold for AegisMail Pro"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "celery[redis]>=5.4.0",
  "cryptography>=43.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.116.1",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "pwdlib[argon2]>=0.2.1",
  "pydantic-settings>=2.4.0",
  "pyjwt>=2.9.0",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2.1",
  "slowapi>=0.1.9",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.5"
]

[project.optional-dependencies]
dev = [
  "black>=24.8.0",
  "ruff>=0.6.1"
]
test = [
  "httpx>=0.27.0",
  "pytest>=8.3.2"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
