[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismail-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.4.0",
  "pydantic-settings>=2.4.0"
]

[tool.setuptools.packages.find]
include = ["worker_app*"]
