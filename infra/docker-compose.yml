services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegismail
      POSTGRES_USER: aegismail
      POSTGRES_PASSWORD: aegismail
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegismail -d aegismail']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ******postgres:5432/aegismail
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../apps/worker
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ******postgres:5432/aegismail
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'celery -A worker_app.celery_app inspect ping --timeout=5 || exit 1']
      interval: 20s
      timeout: 10s
      retries: 5

  web:
    build:
      context: ../apps/web
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000/api/v1
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
